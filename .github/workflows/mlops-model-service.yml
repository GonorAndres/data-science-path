name: mlops-model-service

on:
  push:
    branches: [main]
    paths:
      - "projects/mlops-model-service/**"
      - ".github/workflows/mlops-model-service.yml"
  pull_request:
    paths:
      - "projects/mlops-model-service/**"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mlops-model-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/mlops-model-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Run pytest
        run: pytest tests/ -v

  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          SERVICE: nlp-reviews
          REGION: us-central1
        working-directory: projects/mlops-model-service
        run: bash scripts/deploy_cloud_run.sh

      - name: Smoke test
        env:
          PROJECT: ${{ secrets.GCP_PROJECT }}
          SERVICE: nlp-reviews
          REGION: us-central1
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION \
            --project $PROJECT \
            --format 'value(status.url)')
          curl --fail "$URL/health"
          curl --fail -X POST "$URL/predict" \
            -H 'Content-Type: application/json' \
            -d '{"text":"Me encanto el producto!"}'
